<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Prior Art Court — mark</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F0EBDE"/>
    </linearGradient>
    <linearGradient id="paperDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231F1A"/>
      <stop offset="1" stop-color="#171614"/>
    </linearGradient>
  </defs>

  <!-- background tile (opaque, both themes get real contrast) -->
  <rect x="0" y="0" width="1024" height="1024" rx="128" fill="url(#paper)"/>

  <!-- inner court frame — double rule, judicial paper feel -->
  <rect x="88" y="88" width="848" height="848" rx="84"
        fill="none" stroke="#1C1A17" stroke-width="14"/>
  <rect x="128" y="128" width="768" height="768" rx="60"
        fill="none" stroke="#1C1A17" stroke-width="4" opacity="0.42"/>

  <!-- seal stripe at top -->
  <rect x="196" y="200" width="632" height="6" fill="#8C2F2F" opacity="0.85"/>

  <!-- centered section mark, the brand glyph used across the site nav -->
  <text x="512" y="700"
        text-anchor="middle"
        font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif"
        font-weight="600"
        font-size="640"
        fill="#1C1A17"
        letter-spacing="-8">§</text>

  <!-- ground line under the glyph, echoing the docket hairline -->
  <rect x="196" y="820" width="632" height="4" fill="#1C1A17" opacity="0.35"/>
  <rect x="288" y="838" width="448" height="2" fill="#1C1A17" opacity="0.22"/>
</svg>
