[pytest]
# Fast lane runs by default: `pytest` runs everything not marked slow.
# Slow lane talks to a live network (or a local devnet with mocks installed
# via sim_installMocks) and is only invoked explicitly: `pytest -m slow`.
addopts = -q -m "not slow"

markers =
    fast: offline tests against gltest's Python VM (default)
    slow: tests that talk to a real GenLayer network (requires --network studionet or localnet)

testpaths = tests
